<!-- Unlinked from the marketing site by design, and told not to index itself by name to the search engines that honour it (a bare
     `robots: noindex` can also keep chat apps from drawing a link preview, which this page needs).

     search. -->

<!-- What a chat app (WhatsApp, Slack, LinkedIn) draws when this address is pasted: the title, one line and the picture.
     It reads only this file, before any script runs, so these must be here and the picture's address absolute. The
     picture is the mark, tinted, on an orange square tile, 240 x 240: under 300 px wide, chat apps draw it as a thumbnail beside
     the words, the way the main site's link looks, rather than as a large banner. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SuperHyre" />

<!-- The page's own colour, before anything else arrives. The theme used to be applied by the console after it
     mounted, which on a slow link left a cream (or white) page in front of a dark console for a second or more.
     This reads the same two things the console reads (the person's saved choice, else the device), puts the
     answer on <html> straight away, and draws a loader in plain CSS so there is something to look at while the
     scripts download. The candidate's page (#/apply) is light by design and is left alone. -->
<script>
  (function () {
    if (window.location.hash.indexOf("#/apply") === 0) return;
    var choice = "system";
    try {
      var saved = window.localStorage.getItem("superhyre.theme");
      if (saved === "light" || saved === "dark") choice = saved;
    } catch (e) { /* a private window: the device decides */ }
    var dark = choice === "dark" || (choice === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    // A browser that has signed in here before is about to be given the console, whose surface is white in the
    // light theme; one that has not is about to see the sign-in, on sand. (Same test as consoleChunk.ts.)
    var app = false;
    try {
      for (var i = 0; i < window.localStorage.length; i += 1) {
        var k = window.localStorage.key(i);
        if (k && /^sb-.+-auth-token$/.test(k)) { app = true; break; }
      }
    } catch (e) { /* a private window: nothing is remembered */ }
    if (app) document.documentElement.setAttribute("data-surface", "app");
  })();
</script>
<style>
  html { background: #f6ece1; }
  /* Signed in before: the console's own surface (white), so the first paint is the colour the shell lands on. */
  html[data-surface="app"] { background: #ffffff; }
  /* ...and the body too: the console's stylesheet paints <body> sand (the sign-in's ground) the moment it arrives,
     which showed for one frame between this loader and the app's own session check. */
  html[data-surface="app"] body { background: #ffffff; }
  html[data-theme="dark"] { background: #171717; color-scheme: dark; }
  body { margin: 0; }
  /* The loader, as the console's own draws it (components/Loader.tsx, loader.css): the mark inside a ring that
     travels round it. Replaced the moment the app mounts. */
  .sh-boot { position: fixed; inset: 0; display: grid; place-items: center; }
  .sh-boot-l { position: relative; display: grid; place-items: center; width: 64px; height: 64px; color: #ea5a1e; }
  .sh-boot-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sh-boot-ring circle { fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.25; }
  .sh-boot-track { opacity: 0.16; }
  .sh-boot-arc { transform-origin: 50% 50%; animation: sh-turn 1.15s linear infinite, sh-breathe 1.9s ease-in-out infinite; }
  .sh-boot-mark { width: 46%; height: 46%; display: block; animation: sh-spin 2.4s cubic-bezier(0.55, 0.05, 0.45, 0.95) infinite; will-change: transform; }
  @keyframes sh-spin { from { transform: perspective(90px) rotateY(0deg); } to { transform: perspective(90px) rotateY(360deg); } }
  @keyframes sh-turn { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
  @keyframes sh-breathe { 0%, 100% { stroke-dasharray: 12 88; } 50% { stroke-dasharray: 40 60; } }
  @media (prefers-reduced-motion: reduce) {
    .sh-boot-mark { animation: none; }
    .sh-boot-arc { animation: none; stroke-dasharray: 28 72; transform: rotate(-90deg); }
    .sh-boot-ring { animation: sh-pulse 2.4s ease-in-out infinite; }
    @keyframes sh-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  }
</style>
